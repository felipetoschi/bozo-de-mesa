<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Piano de Mesa</title>
<style>
  :root{--fundo:#1d1b19;--barra:#2a2724;--texto:#f1e9dc;--ouro:#e0b354;--branca:#fbf8f2;--preta:#1a1a1a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--fundo);color:var(--texto);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;background:var(--barra);border-bottom:2px solid #000}
  h1{font-size:18px;margin:0 8px 0 0;color:var(--ouro)}
  button{font:inherit;font-size:15px;color:var(--texto);background:#3b3732;border:1px solid #57514a;border-radius:10px;padding:8px 12px;touch-action:manipulation}
  button.on{background:var(--ouro);color:#1d1b19;border-color:var(--ouro);font-weight:700}
  label{display:flex;align-items:center;gap:6px;font-size:15px}
  input[type=range]{width:110px;accent-color:var(--ouro)}
  .grupo{display:flex;gap:4px;align-items:center}
  #teclados{flex:1;display:flex;flex-direction:column;gap:10px;padding:10px;min-height:0;touch-action:none}
  .teclado{position:relative;flex:1;min-height:0;background:#000;border-radius:8px;overflow:hidden;box-shadow:0 4px 12px #0008}
  .tecla{position:absolute;top:0;border-radius:0 0 6px 6px;display:flex;align-items:flex-end;justify-content:center;
    font-size:12px;padding-bottom:6px;transition:background .05s}
  .branca{height:100%;background:linear-gradient(#e9e4da,var(--branca) 12%);border:1px solid #9b958a;color:#7a7266;z-index:1}
  .preta{height:62%;background:linear-gradient(#444,var(--preta) 30%);border:1px solid #000;color:#aaa;z-index:2;
    box-shadow:inset 0 -6px 0 #000a;font-size:10px}
  .branca.toca{background:linear-gradient(#d9c08a,#f3dfae)}
  .preta.toca{background:linear-gradient(#7a6430,#4a3c1c);box-shadow:none}
  .do{color:#c0392b;font-weight:700}
  .semnome .tecla span{display:none}
</style>
</head>
<body>
<header>
  <h1>🎹 Piano</h1>
  <div class="grupo">Fileiras:
    <button data-f="1">1</button><button data-f="2" class="on">2</button><button data-f="3">3</button><button data-f="4">4</button>
  </div>
  <button id="bSust">Sustentar: não</button>
  <button id="bNomes" class="on">Nomes: sim</button>
  <label>Volume <input id="vol" type="range" min="0" max="100" value="70"></label>
</header>
<div id="teclados"></div>
<script>
// 88 teclas, do Lá0 (MIDI 21) ao Dó8 (MIDI 108), divididas em fileiras para caberem no tablet
const PRIMEIRA = 21, ULTIMA = 108;
const NOMES = ['Dó','Dó#','Ré','Ré#','Mi','Fá','Fá#','Sol','Sol#','Lá','Lá#','Si'];
const ehPreta = m => [1,3,6,8,10].includes(m % 12);
let fileiras = 2, sustentar = false;

// ---------- som (sintetizado, sem arquivos) ----------
let ctx, mestre;
function audio(){
  if(!ctx){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    mestre = ctx.createGain(); mestre.gain.value = vol.value/100;
    mestre.connect(comp); comp.connect(ctx.destination);
  }
  if(ctx.state === 'suspended') ctx.resume();
  return ctx;
}
const soando = new Map(); // midi -> {g, oscs}
function tocar(m){
  const c = audio(), t = c.currentTime;
  parar(m, true);
  const f = 440 * Math.pow(2, (m - 69) / 12);
  const g = c.createGain();
  const filtro = c.createBiquadFilter(); filtro.type = 'lowpass';
  filtro.frequency.setValueAtTime(Math.min(f * 8, 12000), t);
  filtro.frequency.exponentialRampToValueAtTime(Math.max(f * 2, 400), t + 1.5);
  const dur = 1 + 5 * (1 - (m - PRIMEIRA) / (ULTIMA - PRIMEIRA)); // graves soam mais tempo
  const pico = 0.35 * (m < 40 ? 1.2 : 1);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(pico, t + 0.005);
  g.gain.exponentialRampToValueAtTime(pico * 0.4, t + 0.25);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  g.connect(filtro); filtro.connect(mestre);
  // harmônicos, com leve desafinação como corda de piano
  const oscs = [[1,1,'triangle'],[2,0.35,'sine'],[3,0.15,'sine'],[4,0.06,'sine'],[1.003,0.4,'sine']].map(([h,a,tipo])=>{
    const o = c.createOscillator(), og = c.createGain();
    o.type = tipo; o.frequency.value = f * h; og.gain.value = a;
    o.connect(og); og.connect(g); o.start(t); o.stop(t + dur + 0.1);
    return o;
  });
  soando.set(m, {g, oscs});
}
function parar(m, ja){
  const s = soando.get(m); if(!s) return;
  if(sustentar && !ja) return;
  const t = ctx.currentTime;
  s.g.gain.cancelScheduledValues(t);
  s.g.gain.setValueAtTime(s.g.gain.value, t);
  s.g.gain.exponentialRampToValueAtTime(0.0008, t + (ja ? 0.03 : 0.25));
  s.oscs.forEach(o => { try{ o.stop(t + 0.3); }catch(e){} });
  soando.delete(m);
}

// ---------- teclado ----------
const area = document.getElementById('teclados');
const teclas = {}; // midi -> elemento
function montar(){
  area.innerHTML = '';
  // divide as teclas brancas por igual entre as fileiras
  const todas = []; for(let m = PRIMEIRA; m <= ULTIMA; m++) todas.push(m);
  const brancas = todas.filter(m => !ehPreta(m));
  const porFila = Math.ceil(brancas.length / fileiras);
  for(let i = 0; i < fileiras; i++){
    const ini = brancas[i * porFila]; if(ini === undefined) break;
    const fimB = brancas[Math.min((i + 1) * porFila, brancas.length) - 1];
    const fim = (i === fileiras - 1) ? ULTIMA : (ehPreta(fimB + 1) ? fimB + 1 : fimB);
    const div = document.createElement('div'); div.className = 'teclado';
    const nb = brancas.filter(m => m >= ini && m <= fim).length;
    const lb = 100 / (nb + (ehPreta(fim) ? 0.3 : 0)); // sobra para a preta do fim
    let x = 0;
    for(let m = ini; m <= fim; m++){
      const el = document.createElement('div');
      const nome = NOMES[m % 12] + (Math.floor(m / 12) - 1);
      el.dataset.m = m;
      if(ehPreta(m)){
        el.className = 'tecla preta';
        el.style.left = (x * lb - lb * 0.3) + '%'; el.style.width = (lb * 0.6) + '%';
        el.innerHTML = '<span>' + NOMES[m % 12] + '</span>';
      } else {
        el.className = 'tecla branca' + (m % 12 === 0 ? ' do' : '');
        el.style.left = (x * lb) + '%'; el.style.width = lb + '%';
        el.innerHTML = '<span>' + (m % 12 === 0 ? nome : NOMES[m % 12]) + '</span>';
        x++;
      }
      div.appendChild(el); teclas[m] = el;
    }
    area.appendChild(div);
  }
  area.classList.toggle('semnome', !nomes);
}

// vários dedos ao mesmo tempo; arrastar o dedo passa de tecla em tecla
const dedos = new Map(); // pointerId -> midi
function teclaEm(x, y){
  const el = document.elementFromPoint(x, y);
  return el && el.closest('.tecla') ? +el.closest('.tecla').dataset.m : null;
}
function apertar(m){ teclas[m] && teclas[m].classList.add('toca'); tocar(m); }
function soltar(m){
  if([...dedos.values()].includes(m)) return;
  teclas[m] && teclas[m].classList.remove('toca'); parar(m);
}
area.addEventListener('pointerdown', e => {
  e.preventDefault();
  const m = teclaEm(e.clientX, e.clientY); if(m === null) return;
  dedos.set(e.pointerId, m); apertar(m);
});
area.addEventListener('pointermove', e => {
  if(!dedos.has(e.pointerId)) return;
  const m = teclaEm(e.clientX, e.clientY), antes = dedos.get(e.pointerId);
  if(m === antes) return;
  dedos.delete(e.pointerId); soltar(antes);
  if(m !== null){ dedos.set(e.pointerId, m); apertar(m); }
});
function fimDedo(e){
  if(!dedos.has(e.pointerId)) return;
  const m = dedos.get(e.pointerId); dedos.delete(e.pointerId); soltar(m);
}
['pointerup','pointercancel','pointerleave'].forEach(t => area.addEventListener(t, fimDedo));
area.addEventListener('contextmenu', e => e.preventDefault());

// ---------- botões ----------
let nomes = true;
document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
  fileiras = +b.dataset.f;
  document.querySelectorAll('[data-f]').forEach(x => x.classList.toggle('on', x === b));
  try{ localStorage.setItem('piano-fileiras', fileiras); }catch(e){}
  montar();
});
bSust.onclick = () => {
  sustentar = !sustentar;
  bSust.textContent = 'Sustentar: ' + (sustentar ? 'sim' : 'não');
  bSust.classList.toggle('on', sustentar);
  if(!sustentar) [...soando.keys()].forEach(m => { if(![...dedos.values()].includes(m)) parar(m); });
};
bNomes.onclick = () => {
  nomes = !nomes;
  bNomes.textContent = 'Nomes: ' + (nomes ? 'sim' : 'não');
  bNomes.classList.toggle('on', nomes);
  area.classList.toggle('semnome', !nomes);
};
vol.oninput = () => { if(mestre) mestre.gain.value = vol.value / 100; };

try{
  const f = +localStorage.getItem('piano-fileiras');
  if(f >= 1 && f <= 4){ fileiras = f; document.querySelectorAll('[data-f]').forEach(x => x.classList.toggle('on', +x.dataset.f === f)); }
}catch(e){}
montar();
</script>
</body>
</html>
