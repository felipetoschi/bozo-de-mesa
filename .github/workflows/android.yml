# Compila o app Android do Bozó de Mesa.
# - Sempre gera um APK de teste (para instalar direto no celular).
# - Se os segredos KEYSTORE_BASE64 e KEYSTORE_PASSWORD existirem, gera também, assinados com a sua chave:
#   o APK para os amigos (atualiza por cima sem perder o placar) e o AAB para a Play Store.
# - Cada mudança no jogo que entra no main cria sozinha uma versão em Releases com o APK assinado
#   (o link de download para os amigos; o app avisa quem já tem instalado).
#   Rodando à mão (Actions → App Android → Run workflow) com "publicar" marcado, também publica.
# Os arquivos ficam em Actions → (compilação) → Artifacts.
name: App Android

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar o APK assinado em Releases (link para os amigos)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Versão e data/hora no jogo
        run: |
          HORA=$(TZ=America/Sao_Paulo date -d @"$(git log -1 --format=%ct)" '+%d/%m/%Y %H:%M')
          sed -i "s|__VERSAO__|Versão 1.0.$VERSION_CODE · atualizada em $HORA|" app/www/index.html
          grep -q "Versão 1.0.$VERSION_CODE" app/www/index.html

      - name: Instalar dependências e copiar o jogo para o projeto Android
        working-directory: app
        run: |
          npm ci
          npx cap sync android

      - name: APK de teste
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v5
        with:
          name: bozo-de-mesa-teste-${{ github.run_number }}
          path: app/android/app/build/outputs/apk/debug/*.apk

      # Sempre compila a versão final, para pegar erros cedo; só é assinada (e enviada) quando a chave existe
      - name: Versão final (APK e AAB)
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            # Tira espaços e quebras de linha que entram sem querer ao colar os segredos
            printf %s "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/upload.jks" 2>/dev/null || true
            KEYSTORE_PASSWORD="$(printf %s "$KEYSTORE_PASSWORD" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            export KEYSTORE_PASSWORD KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
            # Confere a chave antes de compilar e diz qual segredo está errado (sem mostrar nenhum dos dois)
            # O arquivo da chave precisa estar inteiro (dá para conferir sem a senha)
            if [ "$(head -c 4 "$KEYSTORE_FILE" | od -An -tx1 | tr -d ' \n')" != "feedfeed" ] || ! printf '\n' | keytool -list -keystore "$KEYSTORE_FILE" >/dev/null 2>&1; then
              echo "::error::O segredo KEYSTORE_BASE64 não está certo. Abra o arquivo bozo-upload.jks.base64.txt no Bloco de Notas, copie TODO o texto (Ctrl+A, Ctrl+C) e cole de novo no segredo."
              exit 1
            fi
            if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias bozo >/dev/null 2>&1; then
              echo "::error::A senha no segredo KEYSTORE_PASSWORD não confere com a chave. Copie de novo só a senha do arquivo LEIA-CHAVE.txt (sem espaços antes ou depois) e atualize o segredo."
              exit 1
            fi
            echo "Chave conferida: arquivo e senha corretos."
          fi
          ./gradlew --no-daemon assembleRelease bundleRelease
          rm -f "$RUNNER_TEMP/upload.jks"
          if [ "$HAS_KEY" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/bozo-de-mesa.apk"
          fi

      - if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: bozo-de-mesa-${{ github.run_number }}
          path: ${{ runner.temp }}/bozo-de-mesa.apk

      - if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: bozo-de-mesa-play-store-${{ github.run_number }}
          path: app/android/app/build/outputs/bundle/release/*.aab

      - name: Publicar em Releases
        if: env.HAS_KEY == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.publicar) || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" "$RUNNER_TEMP/bozo-de-mesa.apk" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest \
            --title "Bozó de Mesa 1.0.${{ github.run_number }}" \
            --notes 'Baixe o arquivo bozo-de-mesa.apk e abra no celular Android para instalar ou atualizar (o placar salvo é mantido).'


      - name: Aviso sobre a chave
        if: env.HAS_KEY != 'true'
        run: echo "::notice::Sem os segredos KEYSTORE_BASE64 e KEYSTORE_PASSWORD, só o APK de teste foi enviado (sem APK assinado, AAB nem publicação). Veja PUBLICAR.md."
