# Publica o link do jogo no GitHub Pages: https://felipetoschi.github.io/bozo-de-mesa/
# Também publica o arquivo único (bozo-de-mesa.html) e a política de privacidade (privacidade.html).
# Precisa estar ligado uma vez em Settings → Pages → Source: GitHub Actions.
name: Site (link do jogo)

on:
  push:
    branches: [main]
    paths:
      - "app/www/**"
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Montar o site
        run: python3 site/montar-site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
